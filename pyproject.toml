[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orvix"
version = "0.2.1"
description = "Optical Real-time Video Ingestion eXchange"
requires-python = ">=3.8,<3.14"
license = {text = "MIT"}
dependencies = []

[project.scripts]
orvix-viewer = "orvix.ui.viewer:main"
orvix-desktop = "orvix.ui.desktop:main"

[project.optional-dependencies]
desktop = [
    "PySide6-Essentials>=6.8,<6.9; python_version >= '3.9'",
    "numpy>=1.26,<3; python_version >= '3.9'",
    "opencv-python>=4.8,<5; python_version >= '3.9'"
]
package = ["pyinstaller>=6.11,<7; python_version >= '3.9'"]
vision = [
    "numpy>=1.24,<2; python_version < '3.9'",
    "numpy>=1.26,<3; python_version >= '3.9'",
    "opencv-python>=4.8,<5"
]
dev = [
    "pytest>=8,<9"
]

[tool.setuptools]
package-dir = {"" = "python/src"}

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.setuptools.package-data]
"orvix.ui" = ["assets/*.svg"]
"orvix.storage" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: exercises the native C++ producer and Python consumer together"
]
