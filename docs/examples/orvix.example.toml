# Ejemplo histórico de configuración. En ORVIX 1.0 se usa Ajustes en la app
# o los argumentos de orvix-capture bridge y orvix-viewer en la terminal.
[capture]
device_index = 0
width = 1280
height = 720
fps = 30

[bridge]
shared_memory_name = "orvix-camera-v1"
slot_count = 3
default_frames = 900

[logging]
level = "INFO"

[vision]
mode = "raw"

[telemetry]
sample_interval_seconds = 1
